<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go-live</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 24px;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 16px;
      margin-bottom: 16px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    label {
      font-weight: 600;
      margin-right: 4px;
    }
    select, button {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 14px;
      border: 1px solid #000000;
      background: #ffffff;
      color: #000000;
      cursor: pointer;
    }
    button:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #error-banner {
      display: none;
      border: 1px solid #000000;
      background-color: #fff0f0;
      padding: 12px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px), (max-width: 390px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .column {
      border: 1px solid #000000;
      padding: 16px;
    }
    .column h2 {
      font-size: 18px;
      font-weight: 700;
      border-bottom: 1px solid #000000;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field-label {
      font-weight: 600;
    }
    .scenario-message-box {
      background-color: #f8f8f8;
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th, td {
      border: 1px solid #000000;
      padding: 6px 8px;
    }
    th {
      background: #f0f0f0;
    }
    tr.rejected {
      background-color: #ffdddd !important;
    }
    .checklist-item {
      padding: 8px;
      border: 1px solid #000000;
      margin-bottom: 8px;
    }
    .checklist-item.ok {
      background-color: #d4edda;
    }
    .replayed-badge {
      font-weight: 600;
      margin-left: 4px;
    }
    .tasks-section {
      margin-top: 14px;
      border-top: 1px solid #000000;
      padding-top: 10px;
    }
    .final-text-section {
      margin-top: 14px;
      border-top: 1px solid #000000;
      padding-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <h1>Go-live</h1>
    <p class="subtitle">Provisions a Fieldbase tenant from the signed contract. An operator marks the account live.</p>

    <div class="controls">
      <div>
        <label for="scenario-select">Scenario:</label>
        <select id="scenario-select">
          <option value="northwind" selected>Northwind</option>
          <option value="contoso">Contoso</option>
          <option value="fabrik">Fabrik</option>
          <option value="northwind_retry">Retry Northwind</option>
        </select>
      </div>

      <div>
        <label for="mode-select">Mode:</label>
        <select id="mode-select">
          <option value="fake" selected>Fake</option>
          <option value="live">Live</option>
        </select>
      </div>

      <button id="run-btn">Run</button>
      <button id="sso-btn" disabled>Record SSO metadata</button>
      <button id="go-live-btn" disabled>Mark live</button>
    </div>
  </header>

  <div id="error-banner"></div>

  <div class="grid">
    <!-- Column 1: Contract -->
    <div class="column" id="col-contract">
      <h2>Contract</h2>
      <div id="contract-content">
        <p>No contract loaded.</p>
      </div>
    </div>

    <!-- Column 2: Trace -->
    <div class="column" id="col-trace">
      <h2>Trace</h2>
      <div id="scenario-message" class="scenario-message-box" style="display:none;"></div>
      <table id="trace-table" style="display:none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Tool</th>
            <th>Status</th>
            <th>Code</th>
          </tr>
        </thead>
        <tbody id="trace-body"></tbody>
      </table>
      <div id="trace-empty"><p>No run yet.</p></div>
    </div>

    <!-- Column 3: Checklist -->
    <div class="column" id="col-checklist">
      <h2>Checklist</h2>
      <div id="checklist-content">
        <p>No checklist loaded.</p>
      </div>
    </div>
  </div>

  <script>
    let currentContract = null;
    let currentTenant = null;

    const runBtn = document.getElementById('run-btn');
    const ssoBtn = document.getElementById('sso-btn');
    const goLiveBtn = document.getElementById('go-live-btn');
    const scenarioSelect = document.getElementById('scenario-select');
    const modeSelect = document.getElementById('mode-select');
    const errorBanner = document.getElementById('error-banner');

    const MODULE_LABELS = {
      'projects': 'Projects',
      'time': 'Time',
      'billing': 'Billing'
    };

    function showError(code, detail) {
      errorBanner.style.display = 'block';
      errorBanner.innerHTML = '<strong>' + escapeHtml(code) + '</strong>: ' + escapeHtml(detail);
    }

    function clearError() {
      errorBanner.style.display = 'none';
      errorBanner.innerHTML = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updateButtons() {
      if (!currentTenant) {
        ssoBtn.disabled = true;
        goLiveBtn.disabled = true;
        return;
      }

      // Record SSO metadata is disabled unless the contract has ssoRequired true and SSO is not ready
      const ssoRequired = currentContract && currentContract.ssoRequired;
      const ssoReady = currentTenant.checklist && currentTenant.checklist.sso && currentTenant.checklist.sso.ok;
      ssoBtn.disabled = !(ssoRequired && !ssoReady);

      // Mark live is disabled unless status is ready_for_review
      goLiveBtn.disabled = currentTenant.status !== 'ready_for_review';
    }

    function renderContract(contract) {
      if (!contract) return;
      currentContract = contract;

      const modulesFormatted = (contract.modules || [])
        .map(m => MODULE_LABELS[m] || m)
        .join(', ');

      const adminsFormatted = (contract.admins || [])
        .map(a => escapeHtml(a.name) + ' (' + escapeHtml(a.email) + ')')
        .join('<br>');

      const html = `
        <div class="field"><span class="field-label">Customer:</span> ${escapeHtml(contract.customerName)}</div>
        <div class="field"><span class="field-label">Seats:</span> ${escapeHtml(contract.seats)}</div>
        <div class="field"><span class="field-label">Region:</span> ${escapeHtml(contract.region)}</div>
        <div class="field"><span class="field-label">Modules:</span> ${escapeHtml(modulesFormatted)}</div>
        <div class="field"><span class="field-label">Admins:</span><br>${adminsFormatted}</div>
        <div class="field"><span class="field-label">SSO Required:</span> ${contract.ssoRequired ? 'Yes' : 'No'}</div>
        <div class="field"><span class="field-label">Metadata Present:</span> ${contract.ssoMetadataPresent ? 'Yes' : 'No'}</div>
      `;
      document.getElementById('contract-content').innerHTML = html;
    }

    function renderTrace(steps, message) {
      const msgBox = document.getElementById('scenario-message');
      if (message) {
        msgBox.style.display = 'block';
        msgBox.textContent = message;
      } else {
        msgBox.style.display = 'none';
      }

      const table = document.getElementById('trace-table');
      const empty = document.getElementById('trace-empty');
      const tbody = document.getElementById('trace-body');

      if (!steps || steps.length === 0) {
        table.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      empty.style.display = 'none';
      tbody.innerHTML = '';

      steps.forEach(step => {
        const tr = document.createElement('tr');
        if (step.errorCode === 'MODULE_NOT_PURCHASED') {
          tr.className = 'rejected';
        }

        const replayedBadge = step.replayed ? ' <span class="replayed-badge">Replayed</span>' : '';
        const codeDisplay = step.errorCode ? escapeHtml(step.errorCode) : 'ok';

        tr.innerHTML = `
          <td>${step.stepIndex}</td>
          <td>${escapeHtml(step.toolName)}${replayedBadge}</td>
          <td>${step.httpStatus}</td>
          <td>${codeDisplay}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderChecklist(tenant, finalText) {
      if (!tenant) return;
      currentTenant = tenant;

      const checklist = tenant.checklist || {};
      const reg = checklist.region || {};
      const mod = checklist.modules || {};
      const adm = checklist.admins || {};
      const sso = checklist.sso || {};
      const live = checklist.live || {};

      let html = `
        <div class="field"><span class="field-label">Status:</span> ${escapeHtml(tenant.status)}</div>
        <div class="field"><span class="field-label">Live:</span> ${tenant.live ? 'Yes' : 'No'}</div>
        <hr style="margin: 10px 0;">

        <div class="checklist-item ${reg.ok ? 'ok' : ''}">
          <strong>Region:</strong> ${reg.ok ? 'OK' : 'Not OK'} (Expected: ${escapeHtml(reg.expected)}, Actual: ${escapeHtml(reg.actual || 'none')})
        </div>

        <div class="checklist-item ${mod.ok ? 'ok' : ''}">
          <strong>Modules:</strong> ${mod.ok ? 'OK' : 'Not OK'}
        </div>

        <div class="checklist-item ${adm.ok ? 'ok' : ''}">
          <strong>Admins:</strong> ${adm.ok ? 'OK' : 'Not OK'}
        </div>

        <div class="checklist-item ${sso.ok ? 'ok' : ''}">
          <strong>SSO:</strong> ${sso.ok ? 'OK' : 'Not OK'} (${escapeHtml(sso.state || 'none')})
        </div>

        <div class="checklist-item ${live.ok ? 'ok' : ''}">
          <strong>Live:</strong> ${live.ok ? 'OK' : 'Not OK'}
        </div>
      `;

      if (tenant.tasks && tenant.tasks.length > 0) {
        html += '<div class="tasks-section"><strong>Tasks:</strong><br>';
        tenant.tasks.forEach(t => {
          html += `<div>• ${escapeHtml(t.title)} (${escapeHtml(t.status)})</div>`;
        });
        html += '</div>';
      }

      if (finalText) {
        html += `<div class="final-text-section"><strong>Model Note:</strong> ${escapeHtml(finalText)}</div>`;
      }

      document.getElementById('checklist-content').innerHTML = html;
      updateButtons();
    }

    async function handleRun() {
      clearError();
      runBtn.disabled = true;

      const scenario = scenarioSelect.value;
      const mode = modeSelect.value;

      try {
        const resp = await fetch('/api/demo/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scenario, mode })
        });

        const data = await resp.json();
        if (!resp.ok) {
          showError(data.code || 'ERROR', data.detail || 'Demo run failed');
          return;
        }

        renderContract(data.contract);
        renderTrace(data.steps, data.message);
        renderChecklist(data.tenant, data.finalText);
      } catch (err) {
        showError('NETWORK_ERROR', err.message);
      } finally {
        runBtn.disabled = false;
        updateButtons();
      }
    }

    async function handleSso() {
      if (!currentTenant) return;
      clearError();
      ssoBtn.disabled = true;

      try {
        const resp = await fetch(`/api/demo/tenants/${currentTenant.tenantId}/sso-metadata`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });

        const data = await resp.json();
        if (!resp.ok) {
          showError(data.code || 'ERROR', data.detail || 'Failed to record SSO metadata');
          return;
        }

        if (currentContract) {
          currentContract.ssoMetadataPresent = true;
          renderContract(currentContract);
        }
        renderChecklist(data, null);
      } catch (err) {
        showError('NETWORK_ERROR', err.message);
      } finally {
        updateButtons();
      }
    }

    async function handleGoLive() {
      if (!currentTenant) return;
      clearError();
      goLiveBtn.disabled = true;

      try {
        const resp = await fetch(`/api/demo/tenants/${currentTenant.tenantId}/go-live`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });

        const data = await resp.json();
        if (!resp.ok) {
          showError(data.code || 'ERROR', data.detail || 'Failed to mark live');
          return;
        }

        renderChecklist(data, null);
      } catch (err) {
        showError('NETWORK_ERROR', err.message);
      } finally {
        updateButtons();
      }
    }

    runBtn.addEventListener('click', handleRun);
    ssoBtn.addEventListener('click', handleSso);
    goLiveBtn.addEventListener('click', handleGoLive);
  </script>
</body>
</html>
